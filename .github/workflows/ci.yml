name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "build.sh", ".github/workflows/**"]
  pull_request:
    paths: ["src/**", "tests/**", "build.sh", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        build-mode: [debug, release]
    uses: ./.github/workflows/reusable-build.yml
    with:
      build-mode: ${{ matrix.build-mode }}

  package:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl
      - run: ./build.sh
      - name: Build-Provenance erzeugen
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/InvoiceTests
      -       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invoice-binary
          path: out/InvoiceTests
