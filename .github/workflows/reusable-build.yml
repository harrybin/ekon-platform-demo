name: Reusable Pascal Build

on:
  workflow_call:
    inputs:
      build-mode:
        description: "debug oder release"
        type: string
        default: release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free Pascal installieren
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl
      - name: Bauen und testen (${{ inputs.build-mode }})
        run: ./build.sh
      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ inputs.build-mode }}
          path: out/test-results.xml
